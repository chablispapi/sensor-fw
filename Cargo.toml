[package]
edition      = "2021"
name         = "sensor-fw"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "sensor-fw"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "1.0.0", features = ["defmt", "esp32s3", "unstable"] }
esp-rtos = { version = "0.2.0", features = [
  "defmt",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
  "embassy",
] }
defmt = "1.0.1"
log = "0.4"
static_cell = "2.1.0"
esp-bootloader-esp-idf = { version = "0.4.0", features = ["defmt", "esp32s3"] }
critical-section = "1.2.0"
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = { version = "0.9.0", features = ["defmt"] }
esp-backtrace = { version = "0.18.1", features = ["defmt", "esp32s3", "panic-handler"] }
esp-println = { version = "0.16.1", features = ["defmt-espflash", "esp32s3", "log-04"] }
esp-radio = { version = "0.17.0", features = ["defmt", "esp-alloc", "esp32s3", "smoltcp", "unstable", "wifi"] }
smoltcp = { version = "0.13.0", default-features = false, features = ["defmt", "medium-ethernet", "medium-ip", "multicast", "proto-dhcpv4", "proto-dns", "proto-ipv4", "socket-dhcpv4", "socket-dns", "socket-icmp", "socket-raw", "socket-tcp", "socket-udp"] }
smoltcp_012 = { package = "smoltcp", version = "0.12.0", default-features = false, features = ["defmt", "medium-ethernet", "proto-ipv4", "socket-raw"] }
tmp1x2 = "1.1.0"
tinymqtt = "0.1.3"
itoa = "1.0"
embassy-executor = "0.9.1"
embassy-net = { version = "0.9.0", features = ["defmt", "proto-ipv4", "medium-ethernet", "tcp", "dns", "dhcpv4"] }
embassy-time = "0.5.1"
embassy-sync = "0.6.2"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units    = 1
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
